<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Keygen · کلیلساز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Vazirmatn:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EEF5FB;--surface:#fff;--surface-2:#F2F7FC;--line:#D9E6F2;--line-soft:#E7F0F8;
--txt:#0B1B2B;--mut:#5E7C97;--brand:#0284C7;--brand-2:#0369A1;--wash:rgba(2,132,199,.09);
--up:#0E9C7B;--down:#DC5F58;--warn:#8A5A08;--warn-bg:#FEF3C7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Manrope','Vazirmatn',system-ui,sans-serif;font-size:15px;line-height:1.6;padding-bottom:40px}
.num,.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{background:linear-gradient(150deg,var(--brand-2),var(--brand));color:#fff;padding:22px 16px 20px;text-align:center}
header .wm{font-weight:300;letter-spacing:.3em;font-size:21px;direction:ltr;text-transform:uppercase;padding-inline-start:.3em}
header .sub{font-size:11.5px;opacity:.85;margin-top:3px}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(11,27,43,.05),0 8px 24px rgba(11,27,43,.05)}
.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--mut);margin-bottom:11px;text-transform:uppercase}
label.fl{display:block;font-size:11.5px;color:var(--mut);margin:12px 0 5px}
input,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:15px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--wash)}
input.mono,textarea{font-family:'IBM Plex Mono',monospace;direction:ltr}
textarea{resize:vertical;font-size:11.5px;line-height:1.5}
.btn{display:block;width:100%;padding:12px;border-radius:11px;border:0;cursor:pointer;background:var(--brand);color:#fff;font-family:inherit;font-weight:700;font-size:14.5px;margin-top:10px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.out{background:transparent;border:1px solid var(--brand);color:var(--brand)}
.btn.danger{background:transparent;border:1px solid rgba(220,95,88,.5);color:var(--down)}
.btn.sm{padding:9px;font-size:12.5px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{border:0;background:transparent;color:var(--mut);font-family:inherit;font-size:12px;padding:9px 2px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff;font-weight:700}
.code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;direction:ltr;unicode-bidi:isolate;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:11px;word-break:break-all;line-height:1.6;margin:8px 0;text-align:start}
.warn{background:var(--warn-bg);border:1px solid #FCD34D;color:var(--warn);border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-bottom:12px}
.hint{font-size:11.5px;color:var(--mut);line-height:1.7;margin:9px 0 0}
.lic{border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:var(--surface-2)}
.lic .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lic .who{flex:1;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:10px;padding:3px 9px;border-radius:99px;font-weight:700}
.pill.a{background:rgba(14,156,123,.14);color:var(--up)}
.pill.w{background:var(--wash);color:var(--brand)}
.pill.e{background:rgba(220,95,88,.14);color:var(--down)}
.meta{font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:9px}
.acts button{padding:8px 3px;font-size:11px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--txt);font-family:inherit;cursor:pointer}
.acts button.dl{color:var(--down);border-color:rgba(220,95,88,.4)}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:22px 10px}
#toast{position:fixed;bottom:24px;inset-inline-end:50%;transform:translate(50%,14px);background:var(--txt);color:#fff;border-radius:11px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.28s;z-index:99}
#toast.show{opacity:1;transform:translate(50%,0)}
</style>
</head>
<body>

<header>
<div class="wm">Keygen</div>
<div class="sub">کلیلسازی چالاککردن · تەنها بۆ خۆت</div>
</header>

<main>
<div class="warn" id="topWarn">
🔒 کلیلی تایبەت لەم فایلەدا نییە. لە وێبگەڕی خۆت بە وشەی نهێنی پارێزراوە — بۆیە ئەگەر کەسێکی تر ئەم لینکە بکاتەوە، هیچی دەست ناکەوێت.
</div>
<div class="card" id="cKeys"></div>
<div class="card" id="cNew"></div>
<div class="card" id="cList"></div>
</main>

<div id="toast"></div>

<script>
'use strict';
const SKEY='darya:keygen:v2';
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const EPOCH=Date.UTC(2020,0,1);

/* D = ئەوەی لە وێبگەڕدا دەمێنێتەوە. کلیلی تایبەت تەنها بە شێوەی شیفرەکراو. */
let D={pub:'',enc:null,items:[]};
let PRIV=null;            /* تەنها لە بیرگەی ئەم دانیشتنە */

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
function el(t,c,h){const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const x=$('#toast');x.textContent=m;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),2200);}
function copyText(txt){
if(navigator.clipboard&&navigator.clipboard.writeText)
navigator.clipboard.writeText(txt).then(()=>toast('کۆپی کرا')).catch(()=>toast('کۆپی نەکرا'));
else toast('کۆپی نەکرا');
}
function b32enc(bytes){
let bits=0,val=0,out='';
for(const b of bytes){val=((val<<8)|b)>>>0;bits+=8;
while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5;val&=(1<<bits)-1;}}
if(bits>0)out+=B32[(val<<(5-bits))&31];
return out;
}
function b32dec(s){
s=String(s).toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1').replace(/U/g,'V');
let bits=0,val=0;const out=[];
for(const ch of s){const i=B32.indexOf(ch);if(i<0)return null;
val=((val<<5)|i)>>>0;bits+=5;
if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8;val&=(1<<bits)-1;}}
return out;
}
function b64u(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);
return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(str){let x=String(str).replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';
const bin=atob(x),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
const isoDay=iso=>Math.round((Date.parse(iso+'T00:00:00Z')-EPOCH)/86400000);
const today=()=>new Date().toISOString().slice(0,10);
function addMonths(iso,m){const [y,mm,d]=iso.split('-').map(Number);
return new Date(Date.UTC(y,mm-1+m,d)).toISOString().slice(0,10);}
const daysLeft=iso=>isoDay(iso)-isoDay(today());
const pretty=id=>String(id).match(/.{1,4}/g).join('-');

/* ---------- storage ---------- */
function save(){try{localStorage.setItem(SKEY,JSON.stringify(D));}catch(e){toast('پاشەکەوت نەکرا');}}
function load(){
try{const r=localStorage.getItem(SKEY);if(r)D=Object.assign(D,JSON.parse(r));}catch(e){}
if(!Array.isArray(D.items))D.items=[];
}

/* ---------- crypto ---------- */
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
async function passKey(pass,salt){
const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},
base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function sealPriv(jwk,pass){
const salt=crypto.getRandomValues(new Uint8Array(16));
const iv=crypto.getRandomValues(new Uint8Array(12));
const k=await passKey(pass,salt);
const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,
new TextEncoder().encode(JSON.stringify(jwk))));
return {salt:b64u(salt),iv:b64u(iv),ct:b64u(ct)};
}
async function openPriv(enc,pass){
const k=await passKey(pass,unb64u(enc.salt));
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(enc.iv)},k,unb64u(enc.ct));
return JSON.parse(new TextDecoder().decode(pt));
}
async function signKey(devIds,endISO){
const n=devIds.length;
const e=isoDay(endISO);
if(!(e>0&&e<65535))throw new Error('date');
const pay=new Uint8Array(4+10*n);
pay[0]=2;pay[1]=n;pay[2]=(e>>>8)&255;pay[3]=e&255;
devIds.forEach((id,i)=>{
const b=b32dec(id);
if(!b||b.length<10)throw new Error('device');
for(let j=0;j<10;j++)pay[4+i*10+j]=b[j];
});
const key=await crypto.subtle.importKey('jwk',PRIV,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
const sig=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,pay));
return b64u(pay)+'.'+b64u(sig);
}

/* ---------- keys card ---------- */
function renderKeys(){
const c=$('#cKeys');c.innerHTML='<div class="eyebrow">کلیلی واژۆ</div>';
if(!hasCrypto()){
c.appendChild(el('div','warn','⚠ ئەم پەڕەیە ناتوانێت کلیل دروست بکات چونکە بە <b>https</b> نەکراوەتەوە.<br>'+
'ناونیشانی ئێستا: <span class="mono">'+esc(location.protocol+'//'+location.host)+'</span><br>'+
'لینکەکە دەبێت بە https:// دەست پێ بکات.'));
return;
}
if(!window.localStorage){
c.appendChild(el('div','warn','⚠ بیرگەی وێبگەڕ داخراوە (لەوانەیە دۆخی نهێنی بێت). پەڕەکە لە پەنجەرەیەکی ئاسایی بکەرەوە.'));
}

/* هیچ کلیلێک نییە */
if(!D.enc){
c.appendChild(el('p','hint','فایلی <span class="mono">private-key.json</span> هەڵبژێرە، پاشان وشەیەکی نهێنی دابنێ. کلیلەکە شیفرە دەکرێت و لەم وێبگەڕەدا دەمێنێتەوە.'));
c.appendChild(el('label','fl','وشەی نهێنی'));
const p1=document.createElement('input');p1.type='password';p1.placeholder='لانیکەم ٨ پیت';
c.appendChild(p1);
const f=document.createElement('input');f.type='file';f.accept='.json,application/json,text/plain';f.style.display='none';
let picked=null;
const pick=el('button','btn ghost sm','هەڵبژاردنی فایلی کلیل');
pick.onclick=()=>f.click();
const status=el('p','hint','');
f.onchange=e=>{
const file=e.target.files[0];if(!file)return;
const r=new FileReader();
r.onload=()=>{
try{
const j=JSON.parse(r.result);
if(!j.pub||!j.priv)throw new Error('bad');
picked=j;status.textContent='✓ فایلەکە خوێندرایەوە';
}catch(err){status.textContent='✕ فایلەکە دروست نییە';}
};
r.readAsText(file);e.target.value='';
};
c.appendChild(pick);c.appendChild(f);c.appendChild(status);

c.appendChild(el('label','fl','یان ناوەڕۆکی فایلەکە لێرە دابنێ'));
const ta=document.createElement('textarea');
ta.rows=4;ta.placeholder='{ "pub": "...", "priv": { ... } }';
ta.oninput=()=>{
const v=ta.value.trim();
if(!v){status.textContent='';return;}
try{
const j=JSON.parse(v);
if(!j.pub||!j.priv)throw new Error('bad');
picked=j;status.textContent='✓ کلیلەکە خوێندرایەوە';
}catch(e){picked=null;status.textContent='… چاوەڕێی دەقی تەواو';}
};
c.appendChild(ta);
const go=el('button','btn','پاراستنی کلیل');
go.onclick=async()=>{
if(!picked){toast('سەرەتا فایلی کلیل هەڵبژێرە');return;}
if(p1.value.length<8){toast('وشەی نهێنی کورتە');return;}
D.pub=picked.pub;
D.enc=await sealPriv(picked.priv,p1.value);
PRIV=picked.priv;
save();renderAll();toast('کلیل پارێزرا');
};
c.appendChild(go);
const gen=el('button','btn ghost sm','یان جووتە کلیلی نوێ دروست بکە');
gen.onclick=async()=>{
if(p1.value.length<8){toast('سەرەتا وشەی نهێنی بنووسە');return;}
if(!confirm('جووتە کلیلی نوێ؟ پێویستە PUBKEY ی نوێ لە بەرنامەکەدا دابنێیت و کلیلە کۆنەکان پووچ دەبنەوە.'))return;
const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
D.pub=b64u(new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey)));
PRIV=await crypto.subtle.exportKey('jwk',kp.privateKey);
D.enc=await sealPriv(PRIV,p1.value);
save();renderAll();toast('دروستکرا');
};
c.appendChild(gen);
return;
}

/* کلیل هەیە بەڵام قوفڵکراوە */
if(!PRIV){
c.appendChild(el('p','hint','وشەی نهێنی بنووسە بۆ کردنەوەی کلیل.'));
const p1=document.createElement('input');p1.type='password';p1.placeholder='وشەی نهێنی';
c.appendChild(p1);
const go=el('button','btn','کردنەوە');
const err=el('p','hint','');
go.onclick=async()=>{
try{
PRIV=await openPriv(D.enc,p1.value);
renderAll();toast('کرایەوە');
}catch(e){err.textContent='✕ وشەی نهێنی هەڵەیە';}
};
p1.onkeydown=e=>{if(e.key==='Enter')go.click();};
c.appendChild(go);c.appendChild(err);
return;
}

/* کراوەیە */
c.appendChild(el('p','hint','ئەم دێڕە لە بەرنامەکەدا لە شوێنی <span class="mono">const PUBKEY=\'\'</span> دایبنێ:'));
c.appendChild(el('div','code',"const PUBKEY='"+esc(D.pub)+"';"));
const b1=el('button','btn out sm','کۆپیکردنی کلیلی گشتی');
b1.onclick=()=>copyText("const PUBKEY='"+D.pub+"';");
c.appendChild(b1);
const b2=el('button','btn ghost sm','دابەزاندنی باکاپی کلیل');
b2.onclick=()=>{
const blob=new Blob([JSON.stringify({pub:D.pub,priv:PRIV},null,1)],{type:'application/json'});
const u=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=u;a.download='private-key.json';a.click();
URL.revokeObjectURL(u);toast('دابەزی');
};
c.appendChild(b2);
const b3=el('button','btn ghost sm','قوفڵکردن');
b3.onclick=()=>{PRIV=null;renderAll();};
c.appendChild(b3);
c.appendChild(el('p','hint','باکاپەکە لە شوێنێکی پارێزراو هەڵبگرە. بەبێ ئەو، ئەگەر وێبگەڕەکە پاک بکرێتەوە ناتوانیت کلیلی نوێ دروست بکەیت.'));
}

/* ---------- new key ---------- */
function renderNew(){
const c=$('#cNew');c.innerHTML='<div class="eyebrow">کلیلی نوێ بۆ کڕیار</div>';
if(!PRIV){c.appendChild(el('div','empty','سەرەتا کلیلەکە بکەرەوە.'));return;}

c.appendChild(el('label','fl','ناوی کڕیار'));
const iName=document.createElement('input');iName.type='text';iName.placeholder='بۆ نموونە: ئاری محەمەد';
c.appendChild(iName);

c.appendChild(el('label','fl','چەند ئامێر؟'));
let seats=1;
const segS=el('div','seg');
const seatOpts=[[1,'١ ئامێر'],[2,'٢ ئامێر'],[3,'٣ ئامێر'],[0,'بێ سنوور']];
const devWrap=el('div');
function paintSeats(){
[...segS.children].forEach((b,i)=>b.classList.toggle('on',seatOpts[i][0]===seats));
devWrap.innerHTML='';
if(seats===0){
devWrap.appendChild(el('div','warn','⚠ کلیلی بێ سنوور بە هیچ ئامێرێکەوە نابەسترێت — کڕیار دەتوانێت بۆ هەرکەس بینێرێت.'));
return;
}
for(let i=0;i<seats;i++){
devWrap.appendChild(el('label','fl','ژمارەی ئامێری '+(i+1)));
const inp=document.createElement('input');
inp.type='text';inp.className='mono dev';inp.placeholder='XXXX-XXXX-XXXX-XXXX';
devWrap.appendChild(inp);
}
}
seatOpts.forEach(([v,l])=>{const b=el('button','',l);b.onclick=()=>{seats=v;paintSeats();};segS.appendChild(b);});
c.appendChild(segS);c.appendChild(devWrap);

c.appendChild(el('label','fl','ماوە'));
let months=1,end=addMonths(today(),1);
const segD=el('div','seg');
const durs=[[1,'١ مانگ'],[3,'٣ مانگ'],[6,'٦ مانگ'],[12,'١ ساڵ'],[0,'بەروار']];
function paintDur(){
[...segD.children].forEach((b,i)=>b.classList.toggle('on',durs[i][0]===months));
if(months)end=addMonths(today(),months);
iEnd.value=end;iEnd.disabled=!!months;iEnd.style.opacity=months?.6:1;
}
durs.forEach(([m,l])=>{const b=el('button','',l);b.onclick=()=>{months=m;paintDur();};segD.appendChild(b);});
c.appendChild(segD);

c.appendChild(el('label','fl','بەرواری بەسەرچوون'));
const iEnd=document.createElement('input');iEnd.type='date';
iEnd.onchange=()=>{end=iEnd.value;};
c.appendChild(iEnd);

c.appendChild(el('label','fl','نرخ (ئارەزوومەندانە)'));
const iPrice=document.createElement('input');iPrice.type='number';iPrice.step='any';iPrice.placeholder='0';
c.appendChild(iPrice);

paintSeats();paintDur();

const out=el('div');
const go=el('button','btn','دروستکردنی کلیل');
go.onclick=async()=>{
const nm=iName.value.trim();
if(!nm){toast('ناوی کڕیار بنووسە');return;}
const devs=[...devWrap.querySelectorAll('input.dev')]
.map(i=>i.value.toUpperCase().replace(/[^0-9A-Z]/g,'')).filter(Boolean);
if(seats>0&&devs.length!==seats){toast('ژمارەی هەموو ئامێرەکان بنووسە');return;}
if(devs.some(d=>d.length!==16)){toast('ژمارەی ئامێر دروست نییە');return;}
if(!end){toast('بەروار دیاری بکە');return;}
let lic;
try{lic=await signKey(devs,end);}catch(e){toast('دروست نەبوو');return;}
D.items.push({id:'K'+Date.now().toString(36),name:nm,devs,end,months,
price:Math.abs(parseFloat(iPrice.value)||0),lic,at:today()});
save();renderList();
iName.value='';iPrice.value='';
devWrap.querySelectorAll('input.dev').forEach(i=>i.value='');
out.innerHTML='<div class="code">'+esc(lic)+'</div>';
const b1=el('button','btn out sm','کۆپیکردنی کلیل');
b1.onclick=()=>copyText(lic);
const b2=el('button','btn ghost sm','کۆپیکردنی نامە بۆ کڕیار');
b2.onclick=()=>copyText('سڵاو '+nm+' 👋\nکلیلی چالاککردنت:\n'+lic+'\nچالاکە تا: '+end);
out.appendChild(b1);out.appendChild(b2);
toast('کلیل دروستکرا');
};
c.appendChild(go);c.appendChild(out);
}

/* ---------- list ---------- */
let q='';
function renderList(){
const c=$('#cList');c.innerHTML='<div class="eyebrow">کڕیارەکان</div>';
const iq=document.createElement('input');
iq.type='text';iq.placeholder='گەڕان بە ناو یان ژمارەی ئامێر…';iq.value=q;
iq.oninput=()=>{q=iq.value;draw();};
c.appendChild(iq);
const holder=el('div');holder.style.marginTop='11px';
c.appendChild(holder);

function draw(){
holder.innerHTML='';
if(!D.items.length){holder.appendChild(el('div','empty','هێشتا هیچ کلیلێک دروست نەکراوە.'));return;}
const s=q.trim().toLowerCase();
const rows=D.items.slice().sort((a,b)=>a.end<b.end?1:-1)
.filter(x=>!s||x.name.toLowerCase().includes(s)||(x.devs||[]).join(' ').toLowerCase().includes(s));
if(!rows.length){holder.appendChild(el('div','empty','هیچ نەدۆزرایەوە.'));return;}
rows.forEach(x=>{
const d=daysLeft(x.end);
const k=d<0?'e':(d<=7?'w':'a');
const lbl=d<0?'بەسەرچووە':(d<=7?'نزیک لە کۆتایی':'چالاک');
const devs=x.devs||[];
const box=el('div','lic');
box.innerHTML='<div class="top"><div class="who">'+esc(x.name)+'</div><span class="pill '+k+'">'+lbl+'</span></div>'+
'<div class="meta"><span>'+(devs.length?devs.length+' ئامێر':'بێ سنوور')+'</span><span class="num">تا '+x.end+'</span></div>'+
(devs.length?'<div class="meta" style="margin-top:3px"><span class="num" style="font-size:10.5px">'+devs.map(pretty).join(' · ')+'</span></div>':'')+
'<div class="meta" style="margin-top:3px"><span>'+(d<0?(-d)+' ڕۆژ لەمەوبەر':d+' ڕۆژ ماوە')+'</span><span class="num">'+(x.price||'')+'</span></div>';
const acts=el('div','acts');
const a1=el('button','','کۆپی');a1.onclick=()=>copyText(x.lic);
const a2=el('button','','نامە');
a2.onclick=()=>copyText('سڵاو '+x.name+' 👋\nکلیلی چالاککردنت:\n'+x.lic+'\nچالاکە تا: '+x.end);
const a3=el('button','','+ئامێر');
a3.onclick=async()=>{
if(!devs.length){toast('ئەم کلیلە بێ سنوورە');return;}
const v=(prompt('ژمارەی ئامێری نوێ')||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
if(!v)return;
if(v.length!==16){toast('ژمارەی ئامێر دروست نییە');return;}
if(devs.indexOf(v)>=0){toast('پێشتر زیادکراوە');return;}
x.devs=devs.concat([v]);
try{x.lic=await signKey(x.devs,x.end);}catch(e){toast('دروست نەبوو');return;}
save();draw();toast('ئامێر زیادکرا — کلیلی نوێ بۆ هەموو ئامێرەکان بنێرە');
};
const a4=el('button','','بەروار');
a4.onclick=async()=>{
const v=(prompt('بەرواری نوێ (YYYY-MM-DD)',x.end)||'').trim();
if(!v)return;
if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||isNaN(Date.parse(v+'T00:00:00Z'))){toast('بەروار دروست نییە');return;}
x.end=v;
try{x.lic=await signKey(x.devs||[],x.end);}catch(e){toast('دروست نەبوو');return;}
save();draw();toast('کلیلی نوێ دروستکرا — بۆ کڕیار بینێرە');
};
acts.appendChild(a1);acts.appendChild(a2);acts.appendChild(a3);acts.appendChild(a4);
const del=el('button','btn danger sm','سڕینەوە');
del.onclick=()=>{if(!confirm('بسڕدرێتەوە؟'))return;D.items=D.items.filter(y=>y.id!==x.id);save();draw();};
box.appendChild(acts);box.appendChild(del);
holder.appendChild(box);
});
}
draw();
}

function renderAll(){renderKeys();renderNew();renderList();}
load();renderAll();
</script>
</body>
</html>
